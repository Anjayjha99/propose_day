<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? 💍</title>

<style>

body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: url("background.jpg") no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
    overflow: hidden;
    color: white;
}

/* Overlay (lighter so background visible) */
.overlay {
    background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
    transition: transform 2s ease;
}

.zoom { transform: scale(1.04); }

.gift {
    font-size: 85px;
    cursor: pointer;
}

.scene {
    display: none;
    flex-direction: column;
    align-items: center;
}

/* Proposal Image */
.boy-img {
    width: 220px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255,105,180,0.4);
    opacity: 0;
    transform: translateY(40px);
    transition: all 1s ease;
}

.showBoy {
    opacity: 1;
    transform: translateY(0);
}

/* Big Headline */
#headline {
    font-size: 36px;
    font-weight: bold;
    margin-bottom: 15px;
    opacity: 0;
    position: relative;
    text-shadow:
        0 0 10px hotpink,
        0 0 20px pink,
        0 0 30px rgba(255,105,180,0.7);
    animation: headlinePulse 2s ease-in-out infinite alternate;
}

@keyframes headlinePulse {
    from { transform: scale(1); }
    to { transform: scale(1.03); }
}

/* Sparkles around headline */
.sparkle {
    position: absolute;
    font-size: 18px;
    animation: sparkleFloat 2s ease-in-out infinite;
}

@keyframes sparkleFloat {
    0% { opacity: 0; transform: translateY(0) scale(0.8); }
    50% { opacity: 1; transform: translateY(-5px) scale(1.1); }
    100% { opacity: 0; transform: translateY(0) scale(0.8); }
}

/* Message */
#message {
    margin-top: 10px;
    font-size: 18px;
    max-width: 340px;
    min-height: 100px;
    transition: opacity 0.6s ease;
}

.fadeOut { opacity: 0; }
.fadeIn { opacity: 1; }

/* Buttons */
.buttons {
    margin-top: 20px;
    position: relative;
    width: 260px;
    height: 100px;
    display: none;
}

button {
    padding: 10px 25px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    position: absolute;
    transition: 0.3s ease;
}

#yesBtn {
    background: hotpink;
    color: white;
    left: 30px;
}

#noBtn {
    background: grey;
    color: white;
    right: 30px;
}

.centerYes {
    position: relative !important;
    left: auto !important;
    right: auto !important;
    margin: 0 auto;
}

/* Hearts explosion */
.heart {
    position: fixed;
    font-size: 22px;
    animation: explode 1.5s ease forwards;
}

@keyframes explode {
    to {
        transform: translateY(-150px) scale(2);
        opacity: 0;
    }
}

/* Petals */
.petal {
    position: fixed;
    top: -20px;
    font-size: 20px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}

/* Mobile */
@media (max-width: 600px) {
    .boy-img { width: 180px; }
    #headline { font-size: 26px; }
    #message { font-size: 16px; max-width: 90%; }
}

</style>
</head>

<body>

<div class="overlay" id="overlay">

<div class="gift" onclick="startProposal()">🎁</div>

<div id="scene" class="scene">
    <img src="proposal.jpg" class="boy-img" id="boy">

    <div id="headline"></div>
    <div id="message"></div>

    <div class="buttons" id="buttons">
        <button id="yesBtn" onclick="celebrate()">Yes ❤️</button>
        <button id="noBtn" onclick="noResponse()">No 😢</button>
    </div>
</div>

</div>

<audio id="bgMusic" src="music.mp3" loop></audio>

<script>

const proposalText =
"From the moment you came into my life,\n" +
"everything changed.\n\n" +
"You are my happiness,\n" +
"my safest place,\n" +
"my forever.\n\n" +
"Will you be mine? 💍❤️";

const acceptedHeadline = "💖 Forever Begins Now 💍";

const acceptedText =
"You just made me the happiest man alive.\n\n" +
"I promise to love you forever. ✨";

let index = 0;

function startProposal() {
    document.querySelector(".gift").style.display = "none";
    document.getElementById("scene").style.display = "flex";
    document.getElementById("overlay").classList.add("zoom");

    document.getElementById("bgMusic").play().catch(()=>{});
    document.getElementById("boy").classList.add("showBoy");

    typeMessage();
    startPetals();
}

function typeMessage() {
    const messageBox = document.getElementById("message");
    messageBox.innerHTML = "";

    const interval = setInterval(() => {
        messageBox.innerHTML += 
            proposalText[index] === "\n" ? "<br>" : proposalText[index];
        index++;

        if (index >= proposalText.length) {
            clearInterval(interval);
            document.getElementById("buttons").style.display = "block";
        }
    }, 40);
}

function noResponse() {

    const messageBox = document.getElementById("message");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    yesBtn.style.display = "none";
    noBtn.style.display = "none";

    messageBox.innerHTML =
        "Hmm… I think that’s not possible 😌<br><br>" +
        "Because my heart already chose you. ❤️";

    setTimeout(() => {
        messageBox.innerHTML = proposalText.replace(/\n/g, "<br>");
        yesBtn.style.display = "block";
        yesBtn.classList.add("centerYes");
    }, 3000);
}

function celebrate() {

    const boy = document.getElementById("boy");
    boy.src = "celebration.jpg";

    document.getElementById("buttons").style.display = "none";

    const headline = document.getElementById("headline");
    headline.innerHTML = acceptedHeadline;
    headline.style.opacity = 1;

    addSparkles();

    document.getElementById("message").innerHTML =
        acceptedText.replace(/\n/g, "<br>");

    explodeHearts();
}

function addSparkles() {
    const headline = document.getElementById("headline");

    for (let i = 0; i < 6; i++) {
        const sparkle = document.createElement("span");
        sparkle.classList.add("sparkle");
        sparkle.innerText = "✨";
        sparkle.style.top = Math.random() * 40 + "px";
        sparkle.style.left = Math.random() * 200 - 100 + "px";
        headline.appendChild(sparkle);
    }
}

function explodeHearts() {
    for (let i = 0; i < 45; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "❤️";
        heart.style.left = 40 + Math.random() * 20 + "vw";
        heart.style.top = 50 + Math.random() * 10 + "vh";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
    }
}

function startPetals() {
    setInterval(() => {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        petal.innerText = Math.random() > 0.5 ? "🌸" : "🌹";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 6000);
    }, 800);
}

</script>

</body>
</html>
