<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? 💍</title>

<style>

/* Background */
body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: url("background.jpg") no-repeat center center;
    background-size: cover;
    background-attachment: fixed;
    overflow: hidden;
    color: white;
}

/* Soft overlay (less blur now) */
.overlay {
    background: radial-gradient(circle at center, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
    transition: transform 2s ease;
}

.zoom { transform: scale(1.04); }

.gift {
    font-size: 85px;
    cursor: pointer;
}

.scene {
    display: none;
    flex-direction: column;
    align-items: center;
}

.boy-img {
    width: 220px;
    border-radius: 20px;
    box-shadow: 0 0 30px rgba(255,105,180,0.4);
    opacity: 0;
    transform: translateY(40px);
    transition: all 1s ease;
}

.showBoy {
    opacity: 1;
    transform: translateY(0);
}

#message {
    margin-top: 20px;
    font-size: 18px;
    max-width: 340px;
    min-height: 100px;
    transition: opacity 0.6s ease;
}

.fadeOut { opacity: 0; }
.fadeIn { opacity: 1; }

.buttons {
    margin-top: 20px;
    position: relative;
    width: 260px;
    height: 100px;
    display: none;
}

button {
    padding: 10px 25px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    position: absolute;
    transition: 0.3s ease;
}

#yesBtn {
    background: hotpink;
    color: white;
    left: 30px;
}

#noBtn {
    background: grey;
    color: white;
    right: 30px;
}

.centerYes {
    position: relative !important;
    left: auto !important;
    right: auto !important;
    margin: 0 auto;
}

/* Hearts */
.heart {
    position: fixed;
    font-size: 22px;
    animation: explode 1.5s ease forwards;
}

@keyframes explode {
    to {
        transform: translateY(-150px) scale(2);
        opacity: 0;
    }
}

/* Petals */
.petal {
    position: fixed;
    top: -20px;
    font-size: 20px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}

/* Mobile fix */
@media (max-width: 600px) {

    body {
        background-size: cover;
        background-position: center;
    }

    .boy-img { width: 180px; }

    #message {
        font-size: 16px;
        max-width: 90%;
    }

    button {
        font-size: 14px;
        padding: 8px 18px;
    }

    .buttons {
        width: 220px;
    }
}

</style>
</head>

<body>

<div class="overlay" id="overlay">

<div class="gift" onclick="startProposal()">🎁</div>

<div id="scene" class="scene">
    <img src="proposal.jpg" class="boy-img" id="boy">
    <div id="message"></div>

    <div class="buttons" id="buttons">
        <button id="yesBtn" onclick="celebrate()">Yes ❤️</button>
        <button id="noBtn" onclick="noResponse()">No 😢</button>
    </div>
</div>

</div>

<audio id="bgMusic" src="music.mp3" loop></audio>

<script>

const proposalText =
"From the moment you came into my life,\n" +
"everything changed.\n\n" +
"You are my happiness,\n" +
"my safest place,\n" +
"my forever.\n\n" +
"Will you be mine? 💍❤️";

const acceptedText =
"She said YES! 💖\n\n" +
"This is the happiest moment of my life.\n" +
"I promise to love you forever. ✨";

let index = 0;

function startProposal() {
    document.querySelector(".gift").style.display = "none";
    document.getElementById("scene").style.display = "flex";
    document.getElementById("overlay").classList.add("zoom");

    document.getElementById("bgMusic").play().catch(()=>{});

    const boy = document.getElementById("boy");
    boy.classList.add("showBoy");

    typeMessage();
    startPetals();
}

function typeMessage() {
    const messageBox = document.getElementById("message");
    messageBox.innerHTML = "";

    const interval = setInterval(() => {
        messageBox.innerHTML += 
            proposalText[index] === "\n" ? "<br>" : proposalText[index];
        index++;

        if (index >= proposalText.length) {
            clearInterval(interval);
            document.getElementById("buttons").style.display = "block";
        }
    }, 40);
}

function noResponse() {

    const messageBox = document.getElementById("message");
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");

    yesBtn.style.display = "none";
    noBtn.style.display = "none";

    messageBox.classList.add("fadeOut");

    setTimeout(() => {
        messageBox.innerHTML =
            "Hmm… I think that’s not possible 😌<br><br>" +
            "Because my heart already chose you. ❤️";
        messageBox.classList.remove("fadeOut");
        messageBox.classList.add("fadeIn");
    }, 600);

    setTimeout(() => {
        messageBox.classList.add("fadeOut");

        setTimeout(() => {
            messageBox.innerHTML = proposalText.replace(/\n/g, "<br>");
            messageBox.classList.remove("fadeOut");
            messageBox.classList.add("fadeIn");

            yesBtn.style.display = "block";
            yesBtn.classList.add("centerYes");

        }, 600);

    }, 3600);
}

function celebrate() {

    const boy = document.getElementById("boy");
    boy.src = "celebration.jpg";

    explodeHearts();

    const messageBox = document.getElementById("message");

    messageBox.classList.add("fadeOut");

    setTimeout(() => {
        messageBox.innerHTML = acceptedText.replace(/\n/g, "<br>");
        messageBox.classList.remove("fadeOut");
        messageBox.classList.add("fadeIn");
    }, 600);

    document.getElementById("buttons").style.display = "none";
}

function explodeHearts() {
    for (let i = 0; i < 45; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "❤️";
        heart.style.left = 40 + Math.random() * 20 + "vw";
        heart.style.top = 50 + Math.random() * 10 + "vh";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
    }
}

function startPetals() {
    setInterval(() => {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        petal.innerText = Math.random() > 0.5 ? "🌸" : "🌹";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 6000);
    }, 800);
}

</script>

</body>
</html>
