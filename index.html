<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Will You Be Mine? 💍</title>

<style>

body {
    margin: 0;
    font-family: 'Georgia', serif;
    background: url("background.jpg") no-repeat center center fixed;
    background-size: cover;
    overflow: hidden;
    color: white;
    animation: bgZoom 20s ease-in-out infinite alternate;
}

@keyframes bgZoom {
    from { background-size: 100%; }
    to { background-size: 110%; }
}

.overlay {
    background: radial-gradient(circle at center, rgba(0,0,0,0.4) 0%, rgba(0,0,0,0.85) 100%);
    backdrop-filter: blur(6px);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
    transition: transform 3s ease;
}

.zoom { transform: scale(1.05); }

.gift {
    font-size: 85px;
    cursor: pointer;
    animation: glow 2s infinite alternate;
}

.scene {
    display: none;
    flex-direction: column;
    align-items: center;
    margin-top: -20px;
}

.boy-img {
    width: 220px;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(255,105,180,0.5);
    opacity: 0;
    transform: translateY(40px);
    transition: all 1.2s ease;
}

.showBoy {
    opacity: 1;
    transform: translateY(0);
}

.float {
    animation: float 3s ease-in-out infinite;
}

@keyframes float {
    0% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
    100% { transform: translateY(0); }
}

#message {
    margin-top: 20px;
    font-size: 18px;
    max-width: 340px;
    min-height: 100px;
    transition: opacity 0.6s ease;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
}

.fadeOut { opacity: 0; }
.fadeIn { opacity: 1; }

.buttons {
    margin-top: 20px;
    position: relative;
    width: 260px;
    height: 100px;
    display: none;
}

button {
    padding: 10px 25px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    position: absolute;
    transition: all 0.3s ease;
}

#yesBtn {
    background: hotpink;
    color: white;
    left: 30px;
}

#yesBtn:hover { transform: scale(1.1); }

#noBtn {
    background: grey;
    color: white;
    right: 30px;
}

.heart {
    position: fixed;
    font-size: 22px;
    animation: explode 1.5s ease forwards;
}

@keyframes explode {
    to {
        transform: translateY(-150px) scale(2);
        opacity: 0;
    }
}

.petal {
    position: fixed;
    top: -20px;
    font-size: 20px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform: translateY(100vh);
        opacity: 0;
    }
}

.bg-heart {
    position: fixed;
    font-size: 18px;
    opacity: 0.2;
    animation: floatUp 6s linear infinite;
}

@keyframes floatUp {
    from { transform: translateY(100vh); }
    to { transform: translateY(-20vh); }
}

@keyframes glow {
    from { filter: drop-shadow(0 0 8px pink); }
    to { filter: drop-shadow(0 0 20px hotpink); }
}

@media (max-width: 600px) {

    .boy-img { width: 180px; }

    #message {
        font-size: 16px;
        max-width: 90%;
    }

    button {
        font-size: 14px;
        padding: 8px 18px;
    }

    .buttons { width: 220px; }

    .gift { font-size: 70px; }
}

</style>
</head>

<body>

<div class="overlay" id="overlay">

<div class="gift" onclick="startProposal()">🎁</div>

<div id="scene" class="scene">
    <img src="proposal.jpg" class="boy-img" id="boy">
    <div id="message"></div>

    <div class="buttons">
        <button id="yesBtn" onclick="celebrate()">Yes ❤️</button>
        <button id="noBtn" onclick="noResponse()">No 😢</button>
    </div>
</div>

</div>

<audio id="bgMusic" src="music.mp3" loop></audio>

<script>

const proposalText =
"From the moment you came into my life,\n" +
"everything changed.\n\n" +
"You are my happiness,\n" +
"my safest place,\n" +
"my forever.\n\n" +
"Will you be mine? 💍❤️";

const acceptedText =
"She said YES! 💖\n\n" +
"This is the happiest moment of my life.\n" +
"I promise to love you forever. ✨";

let index = 0;

function startProposal() {
    document.querySelector(".gift").style.display = "none";
    document.getElementById("scene").style.display = "flex";
    document.getElementById("overlay").classList.add("zoom");

    document.getElementById("bgMusic").play().catch(()=>{});

    const boy = document.getElementById("boy");
    boy.classList.add("showBoy","float");

    typeMessage();
    startPetals();
    startBackgroundHearts();
}

function typeMessage() {
    const messageBox = document.getElementById("message");
    messageBox.innerHTML = "";

    const interval = setInterval(() => {
        messageBox.innerHTML += 
            proposalText[index] === "\n" ? "<br>" : proposalText[index];
        index++;

        if (index >= proposalText.length) {
            clearInterval(interval);
            document.querySelector(".buttons").style.display = "block";
        }
    }, 40);
}

function noResponse() {

    const messageBox = document.getElementById("message");
    const noBtn = document.getElementById("noBtn");

    noBtn.style.display = "none";

    messageBox.classList.add("fadeOut");

    setTimeout(() => {
        messageBox.innerHTML =
            "Hmm… I think that’s not possible 😌<br><br>" +
            "Because my heart already chose you. ❤️";
        messageBox.classList.remove("fadeOut");
        messageBox.classList.add("fadeIn");
    }, 600);

    setTimeout(() => {
        messageBox.classList.add("fadeOut");
        setTimeout(() => {
            messageBox.innerHTML = proposalText.replace(/\n/g, "<br>");
            messageBox.classList.remove("fadeOut");
            messageBox.classList.add("fadeIn");
        }, 600);
    }, 3600);
}

function celebrate() {

    const boy = document.getElementById("boy");
    boy.src = "celebration.jpg";
    boy.classList.remove("float");

    explodeHearts();

    const messageBox = document.getElementById("message");
    messageBox.classList.add("fadeOut");

    setTimeout(() => {
        messageBox.innerHTML = acceptedText.replace(/\n/g, "<br>");
        messageBox.classList.remove("fadeOut");
        messageBox.classList.add("fadeIn");
    }, 600);

    document.getElementById("yesBtn").style.display = "none";
    document.getElementById("noBtn").style.display = "none";
}

function explodeHearts() {
    for (let i = 0; i < 45; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerText = "❤️";
        heart.style.left = 40 + Math.random() * 20 + "vw";
        heart.style.top = 50 + Math.random() * 10 + "vh";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1500);
    }
}

function startPetals() {
    setInterval(() => {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        petal.innerText = Math.random() > 0.5 ? "🌸" : "🌹";
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 6000);
    }, 700);
}

function startBackgroundHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("bg-heart");
        heart.innerText = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 1500);
}

</script>

</body>
</html>
